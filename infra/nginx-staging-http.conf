# Bootstrap HTTP-only config. Replace with nginx-staging.conf after certificate issuance.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /var/log/nginx/muhasaba-error.log crit;
    return 404;
}

server {
    listen 80;
    server_name ahmedeman.site;
    access_log off;
    error_log /var/log/nginx/muhasaba-error.log crit;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        default_type application/json;
        return 503 '{"service":"Muhasaba","status":"TLS setup in progress"}';
    }
}
