# Host Nginx configuration; install only after the named certificate exists.
# DNS-only origin: do not trust incoming client forwarding headers.
limit_req_zone $binary_remote_addr zone=muhasaba_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=muhasaba_auth:10m rate=2r/s;

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /var/log/nginx/muhasaba-error.log crit;
    return 404;
}

server {
    listen 80;
    server_name ahmedeman.site;
    access_log off;
    error_log /var/log/nginx/muhasaba-error.log crit;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://ahmedeman.site$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ahmedeman.site;
    ssl_certificate /etc/letsencrypt/live/ahmedeman.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ahmedeman.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/muhasaba-error.log crit;
    client_max_body_size 1m;
    limit_req_status 429;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    proxy_set_header Host ahmedeman.site;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    location = / {
        default_type application/json;
        return 200 '{"service":"Muhasaba","environment":"staging","client":"Flutter","status":"Not a production release"}';
    }
    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/v1/auth/ {
        limit_req zone=muhasaba_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location /api/v1/ {
        limit_req zone=muhasaba_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        return 404;
    }
}
