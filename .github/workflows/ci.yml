name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.10.8"
          python-version: "3.13"
      - run: uv sync --locked
        working-directory: backend
      - run: uv run --locked ruff check .
        working-directory: backend
      - run: uv run --locked ruff format --check .
        working-directory: backend
      - run: uv run --locked pytest
        working-directory: backend
      - name: Start local stack
        run: |
          cp infra/.env.example .env
          docker compose --env-file .env -f infra/compose.yml up --build --wait --wait-timeout 120
      - name: Check API and migration connection
        run: |
          curl --fail http://127.0.0.1:8000/health
          docker compose --env-file .env -f infra/compose.yml exec -T api alembic upgrade head
          docker compose --env-file .env -f infra/compose.yml exec -T api alembic current
      - name: Create isolated integration database
        run: docker compose --env-file .env -f infra/compose.yml exec -T db createdb -U postgres -O muhasaba muhasaba_test
      - name: PostgreSQL catalog and migration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://muhasaba:local_app_only@127.0.0.1:5432/muhasaba_test
        run: uv run --locked pytest tests/integration -ra
      - name: Stack logs
        if: failure()
        run: docker compose --env-file .env -f infra/compose.yml logs
      - name: Stop local stack
        if: always()
        run: docker compose --env-file .env -f infra/compose.yml down

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
