name: muhasaba

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: muhasaba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy infra/.env.example to .env first}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Copy infra/.env.example to .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d muhasaba"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://muhasaba:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@db:5432/muhasaba
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
